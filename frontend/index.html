<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibeathon Gate Entry</title>
<style>
  body {
    font-family: 'Orbitron', Arial, sans-serif;
    text-align: center;
    margin-top: 30px;
    background: radial-gradient(ellipse at top left, #1a1a2e 60%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .stars {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0; left: 0;
    z-index: -1;
    background: transparent;
    pointer-events: none;
  }
  .planet {
    position: absolute;
    left: 10vw;
    top: 10vh;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 40% 40%, #f9d423 60%, #ff4e50 100%);
    border-radius: 50%;
    box-shadow: 0 0 60px 20px #f9d42355;
    z-index: 0;
    animation: planetMove 8s infinite alternate ease-in-out;
  }
  @keyframes planetMove {
    0% { left: 10vw; top: 10vh; }
    100% { left: 80vw; top: 20vh; }
  }
  video {
    border: 3px solid #fff;
    margin: 10px;
    border-radius: 10px;
    box-shadow: 0 0 20px #00d2d3;
    background: #222;
  }
  button {
    padding: 14px 32px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00d2d3 0%, #1a1a2e 100%);
    color: #fff;
    font-size: 18px;
    font-family: 'Orbitron', Arial, sans-serif;
    letter-spacing: 2px;
    box-shadow: 0 0 10px #00d2d3;
    transition: background 0.3s, transform 0.2s;
  }
  button:hover {
    background: linear-gradient(90deg, #ff4e50 0%, #f9d423 100%);
    transform: scale(1.07);
  }
  #scanProgress {
    width: 320px;
    height: 22px;
    border: 2px solid #fff;
    border-radius: 8px;
    margin: 24px auto;
    display: none;
    background: #222;
    overflow: hidden;
    box-shadow: 0 0 10px #00d2d3;
  }
  #scanBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f9d423 0%, #ff4e50 100%);
    transition: width 0.2s;
  }
  #faceResult {
    font-weight: bold;
    margin-top: 16px;
    font-size: 22px;
    color: #f9d423;
    text-shadow: 0 0 8px #ff4e50;
  }
  .game-section {
    margin: 40px auto 0 auto;
    padding: 24px 0;
    max-width: 400px;
    background: rgba(15,52,96,0.7);
    border-radius: 16px;
    box-shadow: 0 0 20px #00d2d3;
  }
  .game-title {
    font-size: 28px;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #f9d423;
  }
  .game-score {
    font-size: 20px;
    color: #f9d423;
    margin-bottom: 10px;
  }
  .game-btn {
    background: linear-gradient(90deg, #00d2d3 0%, #1a1a2e 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 16px;
    margin: 8px;
    box-shadow: 0 0 8px #00d2d3;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  .game-btn:hover {
    background: linear-gradient(90deg, #ff4e50 0%, #f9d423 100%);
    transform: scale(1.07);
  }
</style>
<link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stars"></div>
<div class="planet"></div>
<h1 style="font-size:42px; color:#fff; letter-spacing:3px; text-shadow:0 0 20px #f9d423; margin-bottom:10px;">Vibeathon Gate Entry</h1>
<p style="font-size:20px; color:#f9d423; margin-bottom:30px; text-shadow:0 0 8px #ff4e50;">Scan your face to enter the Vibeathon!</p>


<video id="video" width="320" height="240" autoplay muted></video><br>
<button id="verifyBtn">Start Scan</button>

<div id="scanProgress"><div id="scanBar"></div></div>
<p id="faceResult"></p>
<!-- Space Game Section Removed -->
</div>

<script>
const video = document.getElementById("video");
const faceResult = document.getElementById("faceResult");
const verifyBtn = document.getElementById("verifyBtn");
const scanProgress = document.getElementById("scanProgress");
const scanBar = document.getElementById("scanBar");

// Space background stars
function createStars() {
  const starsDiv = document.querySelector('.stars');
  for(let i=0;i<120;i++){
    const star = document.createElement('div');
    star.style.position = 'absolute';
    star.style.width = '2px';
    star.style.height = '2px';
    star.style.borderRadius = '50%';
    star.style.background = '#fff';
    star.style.top = Math.random()*100+'vh';
    star.style.left = Math.random()*100+'vw';
    star.style.opacity = Math.random()*0.8+0.2;
    star.style.boxShadow = `0 0 ${Math.random()*8+2}px #fff`;
    starsDiv.appendChild(star);
  }
}
createStars();

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream)
  .catch(err => console.error(err));

const referenceImg = new Image();
referenceImg.src = 'sap.jpg'; // reference image
let referenceData = null;

referenceImg.onload = () => {
  const canvas = document.createElement("canvas");
  canvas.width = 100; canvas.height = 100;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(referenceImg,0,0,100,100);
  referenceData = ctx.getImageData(0,0,100,100);
  faceResult.innerText = "Ready. Press 'Start Scan'.";
};

function compareImages(data1, data2){
  if(!data1 || !data2) return false;
  let diff=0;
  for(let i=0;i<data1.data.length;i+=4){
    diff += Math.abs(data1.data[i]-data2.data[i]);
    diff += Math.abs(data1.data[i+1]-data2.data[i+1]);
    diff += Math.abs(data1.data[i+2]-data2.data[i+2]);
  }
  let avgDiff = diff / (data1.data.length/4);
  return avgDiff < 5000;
}

verifyBtn.addEventListener("click", ()=>{
  if(!referenceData){ faceResult.innerText="Reference image not loaded."; return; }

  scanProgress.style.display = "block";
  scanBar.style.width = "0%";
  faceResult.innerText = "Scanning... Hold still!";

  let progress = 0;
  const scanInterval = setInterval(()=>{
    progress += 5;
    scanBar.style.width = progress + "%";

    if(progress >= 100){
      clearInterval(scanInterval);

      const canvas = document.createElement("canvas");
      canvas.width=100; canvas.height=100;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video,0,0,100,100);
      const webcamData = ctx.getImageData(0,0,100,100);

      if(compareImages(referenceData, webcamData)){
        faceResult.innerHTML = "🎉 Access Granted! Redirecting to Vibeathon...";
        setTimeout(()=>{ window.location.href='events.html'; },1000);
      } else {
        faceResult.innerHTML = "❌ Access Denied! Face does not match. Try again.";
        scanProgress.style.display = "none";
      }
    }
  },100);
});

// Space Clicker Game
// Space Clicker Game JavaScript Removed
let score = 0;
const gameBtn = document.getElementById('gameBtn');
const gameScore = document.getElementById('gameScore');
const gameMsg = document.getElementById('gameMsg');
let meteorTimeout;

function randomMeteor(){
  gameBtn.style.position = 'absolute';
  gameBtn.style.left = Math.random()*60+20+'vw';
  gameBtn.style.top = Math.random()*30+60+'vh';
  gameBtn.innerHTML = '☄️ Meteor!';
}

gameBtn.addEventListener('click', ()=>{
  score++;
  gameScore.innerText = 'Score: '+score;
  gameMsg.innerText = score >= 10 ? '🌟 You are a Space Ace! 🌟' : '';
  clearTimeout(meteorTimeout);
  meteorTimeout = setTimeout(randomMeteor, 600);
  randomMeteor();
});

// Initial meteor position
randomMeteor();
</script>
</body>
</html>
