<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibeathon Events</title>
<style>
  body {
    font-family: 'Orbitron', Arial, sans-serif;
    text-align: center;
    margin-top: 30px;
    background: radial-gradient(ellipse at top left, #1a1a2e 60%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .stars {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0; left: 0;
    z-index: -1;
    background: transparent;
    pointer-events: none;
  }
  .planet {
    position: absolute;
    left: 10vw;
    top: 10vh;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 40% 40%, #f9d423 60%, #ff4e50 100%);
    border-radius: 50%;
    box-shadow: 0 0 60px 20px #f9d42355;
    z-index: 0;
    animation: planetMove 8s infinite alternate ease-in-out;
  }
  @keyframes planetMove {
    0% { left: 10vw; top: 10vh; }
    100% { left: 80vw; top: 20vh; }
  }
  h1 {
    font-size:42px;
    color:#fff;
    letter-spacing:3px;
    text-shadow:0 0 20px #f9d423;
    margin-bottom:10px;
  }
  h3 {
    margin: 10px;
    color: #f9d423;
    text-shadow: 0 0 8px #ff4e50;
  }
  button {
    padding: 14px 32px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00d2d3 0%, #1a1a2e 100%);
    color: #fff;
    font-size: 18px;
    font-family: 'Orbitron', Arial, sans-serif;
    letter-spacing: 2px;
    box-shadow: 0 0 10px #00d2d3;
    transition: background 0.3s, transform 0.2s;
  }
  button:hover {
    background: linear-gradient(90deg, #ff4e50 0%, #f9d423 100%);
    transform: scale(1.07);
  }
  #badgeBoard {
    margin-top: 20px;
    background: rgba(15,52,96,0.7);
    border-radius: 16px;
    box-shadow: 0 0 20px #00d2d3;
    padding: 16px 0;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .badge {
    display:inline-block;
    background:linear-gradient(90deg,#4caf50 0%,#00d2d3 100%);
    color:white;
    padding:10px;
    margin:5px;
    border-radius:8px;
    font-family: 'Orbitron', Arial, sans-serif;
    font-size:16px;
    box-shadow: 0 0 8px #00d2d3;
  }
  #map {
    margin: 24px auto;
    width: 80%;
    height: 400px;
    border:3px solid #fff;
    border-radius:10px;
    position: relative;
    background: linear-gradient(135deg,#0f3460 60%,#1a1a2e 100%);
    display:none;
    box-shadow: 0 0 20px #00d2d3;
  }
  .checkpoint {
    width: 44px;
    height: 44px;
    background: linear-gradient(90deg,#f9d423 0%,#ff4e50 100%);
    border-radius: 50%;
    position: absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition: transform 0.3s;
    font-size: 18px;
    box-shadow: 0 0 10px #ff4e50;
  }
  .checkpoint:hover {
    transform: scale(1.2);
    box-shadow: 0 0 20px #f9d423;
  }
  #medal {
    margin-top:20px;
    font-size:28px;
    color:#fbc02d;
    font-weight:bold;
    display:none;
    text-shadow: 0 0 10px #f9d423;
  }
  #chatContainer {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    background: rgba(15,52,96,0.95);
    border:2px solid #fff;
    border-radius:10px;
    padding:10px;
    box-shadow: 2px 2px 20px #00d2d3;
    color: #fff;
    font-family: 'Orbitron', Arial, sans-serif;
    z-index: 10;
  }
  #chatBox {
    height: 200px;
    overflow-y: auto;
    border:1px solid #ccc;
    padding:5px;
    margin-bottom:5px;
    background:#222;
    border-radius:5px;
    text-align:left;
    color: #fff;
    font-size: 15px;
  }
  #userInput {
    width: calc(100% - 60px);
    padding:5px;
    border-radius: 5px;
    border: none;
    font-size: 15px;
    background: #222;
    color: #fff;
  }
</style>
<link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stars"></div>
  <!-- <div class="planet"></div> -->
<h1>Welcome to Vibeathon Events!</h1>
<h3>Select an event to participate:</h3>

<button onclick="selectEvent('Music Battle')">Music Battle</button>
<button onclick="selectEvent('Dance Show')">Dance Show</button>
<button onclick="selectEvent('Coding Challenge')">Coding Challenge</button>
<button onclick="selectEvent('Quiz Competition')">Quiz Competition</button>
<button onclick="selectEvent('Sports Arena')">Sports Arena</button>

<div id="badgeBoard"><h3>Badges Earned:</h3></div>
<div id="map"></div>
<div id="medal">🏅 Congratulations! You earned the Medal! 🏅</div>

<!-- Chatbot -->
<div id="chatContainer">
  <div id="chatBox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
const badgeBoard = document.getElementById("badgeBoard");
const map = document.getElementById("map");
const medalDiv = document.getElementById("medal");
const chatBox = document.getElementById("chatBox");

// Space background stars
function createStars() {
  const starsDiv = document.querySelector('.stars');
  /* .planet styles removed */
  /* @keyframes planetMove removed */
let badges = [];
let checkpointsCreated = {};

const eventsCheckpoints = {
  "Music Battle": [{top:50,left:50},{top:150,left:200},{top:100,left:350}],
  "Dance Show": [{top:60,left:60},{top:200,left:180},{top:150,left:300}],
  "Coding Challenge": [{top:50,left:50},{top:150,left:200},{top:100,left:350}],
  "Quiz Competition": [{top:70,left:70},{top:180,left:220},{top:130,left:370}],
  "Sports Arena": [{top:50,left:50},{top:150,left:200},{top:100,left:350}]
};

// Event selection
function selectEvent(eventName){
  if(!badges.includes(eventName)){
    badges.push(eventName);

    // Add visual badge
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.innerText = eventName + " Badge";
    badgeBoard.appendChild(badge);

    addBotMessage(`🎉 Congrats! You earned a badge for ${eventName}.`);
  } else {
    addBotMessage(`You already have the ${eventName} badge.`);
  }

  showMap(eventName);
  updateBadgeCount();
  checkMedal();
}

// Display badge count in chatbot
function updateBadgeCount(){
  addBotMessage(`Total badges earned: ${badges.length}`);
}

// Show map with checkpoints
function showMap(eventName){
  map.innerHTML = '';
  map.style.display = 'block';
  checkpointsCreated[eventName] = [];

  eventsCheckpoints[eventName].forEach((pos,i)=>{
    const cp = document.createElement('div');
    cp.className = 'checkpoint';
    cp.style.top = pos.top + 'px';
    cp.style.left = pos.left + 'px';
    cp.innerText = i+1;
    cp.dataset.event = eventName;

    cp.addEventListener('click', ()=>{
      if(!checkpointsCreated[eventName].includes(i)){
        checkpointsCreated[eventName].push(i);
        addBotMessage(`Checkpoint ${i+1} completed for ${eventName}!`);
      }
      checkMedal();
    });

    map.appendChild(cp);
  });
}

// Check if all badges/checkpoints done
function checkMedal(){
  const totalBadges = Object.keys(eventsCheckpoints).length;
  const completedCheckpoints = Object.values(checkpointsCreated).reduce((sum, arr)=>sum + arr.length,0);

  if(badges.length === totalBadges && completedCheckpoints >= totalBadges*3){
    medalDiv.style.display = 'block';
    addBotMessage("🏅 You earned the Vibeathon Medal! Congratulations!");
  }
}

// Chatbot functions
function addBotMessage(msg){
  const p = document.createElement('p');
  p.innerHTML = "<strong>Bot:</strong> " + msg;
  chatBox.appendChild(p);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage(){
  const input = document.getElementById('userInput');
  const userMsg = input.value.trim();
  if(userMsg === "") return;

  const p = document.createElement('p');
  p.innerHTML = "<strong>You:</strong> " + userMsg;
  chatBox.appendChild(p);
  chatBox.scrollTop = chatBox.scrollHeight;
  input.value = "";

  let response = "Sorry, I didn't understand that. Ask about badges, events, or directions.";

  if(userMsg.toLowerCase().includes("badge")) response = `You have earned ${badges.length} badge(s).`;
  if(userMsg.toLowerCase().includes("directions")) response = "Click an event button and then click checkpoints on the map to earn badges!";
  if(userMsg.toLowerCase().includes("events")) response = "Available events: Music Battle, Dance Show, Coding Challenge, Quiz Competition, Sports Arena.";

  setTimeout(()=> addBotMessage(response), 500);
}
</script>
</body>
</html>
